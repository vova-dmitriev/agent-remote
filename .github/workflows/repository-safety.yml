name: Repository safety
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks with checksum verification
        run: bash scripts/security/install-gitleaks-linux.sh
      - name: Pull the digest-pinned Semgrep image
        run: docker pull "$(node --input-type=module -e "import { SEMGREP_IMAGE } from './scripts/security/semgrep.mjs'; process.stdout.write(SEMGREP_IMAGE)")"
      - name: Check public files, Semgrep SecObserve rules, complete history and hook regressions
        run: |
          node scripts/security/check.mjs worktree
          node scripts/security/check.mjs history
          node --test scripts/security/check.test.mjs scripts/validation/pre-commit.test.mjs
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.3'
      - name: Prepare trusted Node runtime and shell test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh
          runtime="$(mktemp -d /tmp/agent-remote-node.XXXXXX)"
          install -D -m 755 "$(node -p 'process.execPath')" "$runtime/bin/node"
          printf '%s\n' "$runtime/bin" >> "$GITHUB_PATH"
      - name: Install pinned tooling and dependencies
        run: |
          npm install --global pnpm@10.34.7
          pnpm install --frozen-lockfile
          bash scripts/security/install-gitleaks-linux.sh
      - name: Start isolated test services
        run: docker compose -f compose.test.yml up -d --wait
      - name: Validate source, types, production build and tests
        run: npm run validate:commit
      - name: Verify shared UI in Storybook and mobile browser fixtures
        run: |
          pnpm exec playwright install --with-deps chrome
          npm run test-storybook
          E2E_APP_PORT=4175 npm run test:e2e
      - name: Preserve synthetic browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify internal Chrome extension package
        run: |
          npm run package:extension
          unzip -t artifacts/chrome-extension/agent-remote-chrome-extension.zip
          npm run verify:extension
  extension-browser:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.3'
      - name: Install pinned tooling and isolated Chromium
        run: |
          npm install --global pnpm@10.34.7
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium
      - name: Exercise MV3 assets and synthetic native host in temporary profiles
        run: npm run test:extension:e2e
  desktop:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.3'
      - name: Install pinned tooling and dependencies
        run: |
          npm install --global pnpm@10.34.7
          pnpm install --frozen-lockfile
      - name: Build production desktop application
        run: npm run build:desktop
      - name: Run native packaged-runtime and Electron integration tests
        run: npm run test:desktop -- --maxWorkers=2
