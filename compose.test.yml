services:
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--maxmemory', '128mb', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:56380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claude_remote_test
      POSTGRES_USER: claude_remote
      POSTGRES_PASSWORD: local_test_only
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U claude_remote -d claude_remote_test']
      interval: 2s
      timeout: 2s
      retries: 30
