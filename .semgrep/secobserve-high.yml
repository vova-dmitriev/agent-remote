    pattern-sanitizers:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: |
                      if($VALIDATION){
                        ...
                        $RES.redirect(...)
                        ...
                      } 
                  - pattern: |
                      $A = $VALIDATION
                      ...
                      if($A){
                        ...
                        $RES.redirect(...)
                        ...
                      }
              - metavariable-pattern:
                  metavariable: $VALIDATION
                  pattern-either:
                    - pattern: |
                        $AL.includes(...)  
                    - pattern: |
                        $AL.indexOf(...) !== -1
                    - pattern: |
                        $AL.find(...) !== undefined
                    - pattern: |
                        $ALS.has(...)
