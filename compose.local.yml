name: claude-remote-local
services:
  redis:
    image: redis:7.4-alpine
    command:
      [
        'redis-server',
        '--requirepass',
        '${PERSONAL_REDIS_PASSWORD:?Run npm run personal first}',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    environment:
      REDISCLI_AUTH: ${PERSONAL_REDIS_PASSWORD:?Run npm run personal first}
    ports:
      - '127.0.0.1:56379:6379'
    volumes:
      - personal_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claude_remote_personal
      POSTGRES_USER: claude_remote
      POSTGRES_PASSWORD: ${PERSONAL_POSTGRES_PASSWORD:?Run npm run personal first}
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - personal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U claude_remote -d claude_remote_personal']
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
volumes:
  personal_redis:
  personal_postgres:
